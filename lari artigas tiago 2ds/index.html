<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão</title>
    <style>
        /* Estilização da página */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* Estilo do botão */
        .button {
            background: linear-gradient(45deg, #ff0099, #ff66cc); /* Gradiente de rosa */
            color: white;
            padding: 20px 40px;
            font-size: 20px;
            border: none;
            border-radius: 50px; /* Bordas arredondadas */
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 153, 0.6); /* Sombras suaves */
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }

        /* Efeito de brilho e foco no hover */
        .button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.5s;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .button:hover {
            background: linear-gradient(45deg, #ff66cc, #ff0099); /* Inverte o gradiente no hover */
            box-shadow: 0 4px 25px rgba(255, 0, 153, 0.8); /* Aumenta a sombra */
        }

        .button:hover::after {
            width: 400%;
            height: 400%;
            opacity: 0;
        }

        /* Efeito de afundar quando pressionado */
        .button:active {
            transform: translateY(4px); /* Afunda o botão */
            box-shadow: 0 2px 10px rgba(255, 0, 153, 0.4); /* Reduz a sombra para simular o afundamento */
        }
    </style>
</head>
<body>

    <!-- Botão Centralizado -->
    <button class="button" onclick="alert('Você clicou no botão brilhante!')">Clique Aqui</button>

</body>
</html>
